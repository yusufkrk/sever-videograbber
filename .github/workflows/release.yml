name: Release

# v3.2.0 gibi bir etiket gönderildiğinde: Windows, macOS (Apple Silicon + Intel) ve Linux
# için kurulum gerektirmeyen programlar derlenir, pencereleri test edilir ve GitHub
# Release'e eklenir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: videograbber-windows-x64.exe
            binary: dist/videograbber.exe
            package: dist/videograbber.exe
            gui_test: true
          - os: macos-latest
            asset: SeverVideoGrabber-macos-apple-silicon.zip
            binary: dist/Sever VideoGrabber.app/Contents/MacOS/Sever VideoGrabber
            package: dist/SeverVideoGrabber.zip
            gui_test: true
          - os: macos-15-intel
            asset: SeverVideoGrabber-macos-intel.zip
            binary: dist/Sever VideoGrabber.app/Contents/MacOS/Sever VideoGrabber
            package: dist/SeverVideoGrabber.zip
            gui_test: true
          - os: ubuntu-22.04
            asset: videograbber-linux-x64
            binary: dist/videograbber
            package: dist/videograbber
            gui_test: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build
        run: python scripts/build_exe.py
      - name: Smoke test
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" doctor
      - name: Window test
        if: matrix.gui_test
        shell: bash
        timeout-minutes: 3
        run: '"${{ matrix.binary }}" gui --selftest'
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.package }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body: |
            ## 📥 İndir / Download
            | Sistem | Dosya |
            | --- | --- |
            | Windows 10/11 | `videograbber-windows-x64.exe` → çift tıkla |
            | macOS (M1/M2/M3/M4) | `SeverVideoGrabber-macos-apple-silicon.zip` → aç, uygulamayı Applications'a sürükle |
            | macOS (Intel) | `SeverVideoGrabber-macos-intel.zip` |
            | Linux | `videograbber-linux-x64` |

            **macOS ilk açılış:** Uygulama Apple tarafından imzalanmadığı için ilk açılışta uyarı çıkar →
            **Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç"**. Ayrıntılar README'de.

            Değişiklikler için [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

  pypi:
    # PyPI'ye yayınlamak için: PyPI'de "trusted publisher" tanımla ve repo değişkeni
    # PUBLISH_TO_PYPI=true ayarla (Settings → Secrets and variables → Actions → Variables).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
